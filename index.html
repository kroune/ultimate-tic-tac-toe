<!doctype html>
<html class="no-js" lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Супер крестики-нолики</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Супер крестики-нолики 9x9">

  <meta property="og:title" content="Супер крестики-нолики">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#667eea">
</head>

<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Супер крестики-нолики</h1>
      <div class="game-info">
        <div class="current-player">
          Ход: <span id="current-player" class="player-x">X</span>
        </div>
        <div class="active-board-info" id="active-board-info">
          Можно ходить на любую доску
        </div>
      </div>
    </header>

    <main class="game-board" id="game-board">
      <!-- Game board will be generated by JavaScript -->
    </main>

    <footer class="game-footer">
      <button class="btn btn-reset" id="reset-btn">Новая игра</button>
      <div class="score-board">
        <span class="score player-x">X: <span id="score-x">0</span></span>
        <span class="score player-o">O: <span id="score-o">0</span></span>
      </div>
    </footer>

    <section class="history-panel">
      <div class="history-header">
        <h3>История ходов</h3>
        <div class="history-controls">
          <button class="history-btn" id="history-first" title="К началу">⏮</button>
          <button class="history-btn" id="history-prev" title="Назад">◀</button>
          <button class="history-btn" id="history-next" title="Вперёд">▶</button>
          <button class="history-btn" id="history-last" title="К концу">⏭</button>
        </div>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">Ходов пока нет</div>
      </div>
    </section>

    <div class="game-over-modal" id="game-over-modal" hidden>
      <div class="modal-content">
        <h2 id="game-over-title">Игра окончена!</h2>
        <p id="game-over-message"></p>
        <button class="btn btn-primary" id="new-game-btn">Новая игра</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>

</body>

</html>
